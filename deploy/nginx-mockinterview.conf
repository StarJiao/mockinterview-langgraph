# 反向代理：默认站点 → 本机 mockinterview(127.0.0.1:8000)。
# 域名 mockinterview.mingxing.work 需先完成 ICP 备案，再在 DNSPod 加 A 记录。
# 以后加新站点时，为各自域名/端口另建 server 块并去掉本文件的 default_server。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mockinterview.mingxing.work _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 面试轮次由前端轮询驱动，后端响应都很快；放宽读超时以防模型收尾拖长。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
