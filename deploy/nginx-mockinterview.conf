# 反向代理：默认站点 → 本机 mockinterview(127.0.0.1:8000)。
# 域名 interview.mingxing.work，A 记录 → 152.136.173.194（ICP 备案进行中）。
# HTTPS 证书由 root 的 acme.sh(DNS-01, dns_tencent) 签发与自动续期，
# 证书安装位置 /etc/nginx/ssl/，续期后自动 systemctl reload nginx。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name interview.mingxing.work _;

    # 80 端口一律 301 跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name interview.mingxing.work;

    ssl_certificate /etc/nginx/ssl/interview.mingxing.work.cer;
    ssl_certificate_key /etc/nginx/ssl/interview.mingxing.work.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 面试轮次由前端轮询驱动，后端响应都很快；放宽读超时以防模型收尾拖长。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
