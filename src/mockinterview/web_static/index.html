<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟面试</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <section id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="brand big"><span class="brand-mark"></span>模拟面试</div>
      <p class="muted">本机运行 · 填写用户名即可进入，不设密码</p>
      <form id="login-form">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" maxlength="32" autocomplete="off" placeholder="例如：焦明星">
        <button class="primary full" type="submit">进入</button>
      </form>
      <p class="hint">用户名只用于区分数据：填同一个名字就能看到同一批会话，这不是安全登录。服务默认监听所有网卡，同网段的人也能访问；请只在可信网络使用，勿在此存放敏感资料。</p>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <div id="main-view" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>模拟面试</div>
      <div class="topright">
        <span class="who" id="who"></span>
        <button class="ghost" id="logout" type="button">退出</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <button class="primary full" id="new-btn" type="button">新建面试</button>
        <div class="side-title">我的面试</div>
        <div id="session-list" class="session-list"></div>
      </aside>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
