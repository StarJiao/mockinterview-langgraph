<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟面试</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <section id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="brand big"><span class="brand-mark"></span>模拟面试</div>
      <p class="muted">凭访问令牌进入 · 用户名只用于区分数据</p>
      <form id="login-form">
        <label for="pass-input">访问令牌</label>
        <input id="pass-input" name="pass_token" type="text" autocomplete="off" placeholder="粘贴作者给你的令牌（链接可自动带入）">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" maxlength="32" autocomplete="off" placeholder="例如：焦明星">
        <button class="primary full" type="submit">进入</button>
      </form>
      <p class="hint">令牌由作者签发：临时令牌从你第一次进入时开始计时，长期令牌不限配额。用户名可随意填写，只用于区分各自的数据，不是身份验证。</p>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <div id="main-view" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>模拟面试</div>
      <div class="topright">
        <span class="who" id="pass-status"></span>
        <span class="who" id="who"></span>
        <button class="ghost" id="logout" type="button">退出</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <button class="primary full" id="new-btn" type="button">新建面试</button>
        <div class="side-title">我的面试</div>
        <div id="session-list" class="session-list"></div>
      </aside>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
